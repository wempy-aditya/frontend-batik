version: "3.8"

services:
  fe-web-batik:
    image: 10.10.11.235:5000/fe-web-batik:latest
    container_name: fe-web-batik
    restart: unless-stopped
    pull_policy: always
    environment:
      - NEXT_PUBLIC_BASE_PATH=/v1
      - BACKEND_API_URL=https://batik.umm.ac.id
      - NEXT_PUBLIC_BACKEND_URL=https://batik.umm.ac.id
      - NEXT_PUBLIC_API_URL=https://batik.umm.ac.id
    expose:
      - "3050"
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"

      - "traefik.http.routers.batik-frontend-v1.rule=Host(`batik.umm.ac.id`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.batik-frontend-v1.entrypoints=websecure"
      - "traefik.http.routers.batik-frontend-v1.tls=true"
      - "traefik.http.routers.batik-frontend-v1.priority=100"

      # No strip-prefix: Next.js basePath=/v1 expects prefix preserved
      - "traefik.http.services.batik-frontend-v1.loadbalancer.server.port=3050"
      - "traefik.http.services.batik-frontend-v1.loadbalancer.server.scheme=http"

networks:
  traefik-proxy:
    external: true
